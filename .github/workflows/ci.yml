name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-verification:
    name: Python Lint, Type & Offline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: |
          pip check

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Python bytecode compilation check
        run: |
          python -m compileall -q .

      - name: Run offline test suite
        env:
          PROVIDER_MODE: fake
        run: |
          pytest

  frontend-verification:
    name: Frontend Lint, Type & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Typecheck TypeScript
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Run unit & contract tests
        working-directory: frontend
        run: |
          npm test

      - name: Build Next.js standalone application
        working-directory: frontend
        run: |
          npm run build

  docker-builds:
    name: Container Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: cvrag-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: cvrag-frontend:ci

  compose-smoke:
    name: Docker Compose Fake-Provider Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-builds]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for wait script
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Launch Compose stack in fake provider mode
        env:
          PROVIDER_MODE: fake
        run: |
          docker compose up -d --build

      - name: Wait for backend readiness probe
        run: |
          python scripts/wait-for-ready.py --url http://localhost:8000/api/v1/health/ready --timeout 60

      - name: Wait for frontend HTTP readiness
        run: |
          python scripts/wait-for-ready.py --url http://localhost:3000/ --timeout 60

      - name: Execute end-to-end chat query through frontend proxy
        run: |
          curl -sSf -X POST http://localhost:3000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"question": "What skills and experience are listed?"}'

      - name: Tear down Compose stack
        if: always()
        run: |
          docker compose down -v
